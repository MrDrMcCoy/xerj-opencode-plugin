name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by publish.yml so a tagged commit runs the same checks.
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # The coverage threshold lives in bunfig.toml. It is the gate that
      # keeps a new branch from landing without a test.
      - run: bun test test/unit --coverage

  build:
    name: Build the TUI and MCP bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      # The TUI bundle binds JSX through the host shim, and the MCP bundle has to
      # run under Node rather than Bun. Neither shows up in the test suites.
      - run: bun run build:tui
      - run: bun run build:mcp
      - name: The MCP server must run under Node
        run: node dist/mcp.mjs --help
      - name: The MCP server must answer a handshake under Node
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 60 node dist/mcp.mjs --project . \
            | head -2 | tee /tmp/mcp.out
          grep -q '"serverInfo"' /tmp/mcp.out
          grep -q '"sysdocs"' /tmp/mcp.out

  integration:
    name: Integration tests against a pinned binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Restore the cached XERJ binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/opencode/xerj-int
          key: xerj-${{ runner.os }}-${{ hashFiles('src/binary/release.ts') }}
      - name: Pick a container engine
        id: engine
        run: |
          # Podman is preferred; hosted runners may not allow it, so fall back
          # to Docker, and to the bare runner when neither works.
          if command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then
            echo "name=podman" >> "$GITHUB_OUTPUT"
          elif command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "name=docker" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi
      - name: Run in a container
        if: steps.engine.outputs.name != ''
        run: |
          ENGINE="${{ steps.engine.outputs.name }}"
          mkdir -p "$HOME/.cache/opencode/xerj-int"
          # The standard pid cap is too low for XERJ's scan pool, which
          # then fails with EAGAIN before it indexes anything.
          "$ENGINE" run --rm --pids-limit=-1 \
            --volume "$PWD":/w \
            --volume "$HOME/.cache/opencode/xerj-int":/xerj-cache \
            --workdir /w \
            --env XERJ_CACHE=/xerj-cache \
            --env HOME=/root \
            docker.io/oven/bun:1.4.4 \
            bun test test/integration
      - name: Run on the runner
        if: steps.engine.outputs.name == ''
        run: |
          # No container engine: the same tests still run, just less isolated.
          bun test test/integration
