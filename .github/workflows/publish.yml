name: Publish

# Publishes to npm only after a tag passes the same checks main runs, so a tag
# that would have failed CI never reaches the registry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged commit
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # `NPM_TOKEN` is an environment secret on `npm`, so the job has to join that
    # environment or the token is not visible to it.
    environment: npm
    permissions:
      # `--provenance` signs the publish with this workflow's identity.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm 10 ships with Node 22 and has no `stage` command, which a
      # staging-scoped token needs.
      - run: npm install -g npm@latest

      - name: The tag and the manifest must agree
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "tag $GITHUB_REF_NAME does not match version $VERSION" >&2
              exit 1
            fi
          fi
          echo "publishing $VERSION"

      - name: Skip a version that is already on the registry
        id: check
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          NAME="$(node -p 'require("./package.json").name')"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already published: $NAME@$VERSION"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: bun install --frozen-lockfile
        if: steps.check.outputs.publish == 'true'

      # A token scoped to staging can create the version but not release it;
      # npm answers E_STAGE_REQUIRED and the version must be approved in the npm
      # UI. Try the direct publish first and fall back to staging so one
      # workflow serves both token kinds.
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: |
          if npm publish --access public --provenance; then
            exit 0
          fi
          echo "Direct publish refused; retrying through the staging area." >&2
          npm stage publish --access public --provenance
          echo "::notice title=npm approval needed::Version staged; approve it at https://www.npmjs.com/"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report
        run: |
          if [ "${{ steps.check.outputs.publish }}" = "true" ]; then
            echo "published $(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')"
          else
            echo "nothing to publish"
          fi
